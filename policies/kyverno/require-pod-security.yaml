apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-restricted-pod-security
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-non-root-and-seccomp
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Pods must run as non-root with RuntimeDefault seccomp profile."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
